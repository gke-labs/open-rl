# One-off vLLM eval of a checkpoint on the shared PVC. The eval implementation
# lives in the server image; this manifest only configures and launches it.
#
# Easiest (stamps the EVAL-* placeholders below, applies, follows the logs):
#   make cluster-eval EVAL_MODEL_PATH=/mnt/shared/open-rl/checkpoints/<model-id>/weights/final
#
# By hand: replace the EVAL-* placeholders below (model path is any checkpoint
# dir or HF model id; data path may stay empty for GSM8K), then
#   kubectl delete job open-rl-vllm-eval --ignore-not-found
#   kubectl apply -f k8s/eval/vllm-eval-job.yaml
#   kubectl logs -f job/open-rl-vllm-eval
#
# By default it evaluates EVAL_EXAMPLES of GSM8K (downloaded in-job). To eval
# your own prompts, write a JSON list of {"prompt": ..., "gold": ...} onto the
# PVC and set DATA_PATH to it. Results print to the log and, if RESULTS_PATH is
# set, are also written as JSON on the PVC.
#
# GPU: defaults to the fft-timeslice cluster's shared DRA ResourceClaim
# (open-rl-trainer-gpu-1): the device plugin is disabled on that node pool, so a
# plain nvidia.com/gpu request would never schedule there. CAVEAT: this job does
# not speak the snapshot-agent protocol, so it does not wait its turn on the
# slice; run it while training is quiet, or it can OOM-collide with a trainer
# that is actively holding the GPU (the job just fails; rerun it). On a cluster
# with spare device-plugin GPUs, use the dedicated-GPU block commented out in
# the resources section instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: open-rl-vllm-eval
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: open-rl-vllm-eval
    spec:
      restartPolicy: Never
      containers:
      - name: eval
        image: ghcr.io/openrl-dev/openrl/server:latest
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-m", "server.scripts.run_vllm_eval"]
        env:
        - name: MODEL_PATH
          value: "EVAL-MODEL-PATH"
        - name: EVAL_EXAMPLES
          value: "EVAL-EXAMPLES"
        # Custom [{prompt, gold}] JSON on the PVC; empty means GSM8K.
        - name: DATA_PATH
          value: "EVAL-DATA-PATH"
        - name: RESULTS_PATH
          value: "/mnt/shared/open-rl/evals/last-eval.json"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        resources:
          claims:
          - name: trainer-gpu
          limits:
            memory: "32Gi"
          requests:
            cpu: "2"
            memory: "16Gi"
        # Dedicated-GPU variant (device-plugin clusters): delete the claims line
        # and the resourceClaims/nodeSelector below, and use:
        #   limits: {nvidia.com/gpu: 1, memory: "32Gi"}
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      resourceClaims:
      - name: trainer-gpu
        resourceClaimName: open-rl-trainer-gpu-1
      nodeSelector:
        group.timeslice.io/trainers: "true"
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
