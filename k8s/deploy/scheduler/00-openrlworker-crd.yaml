---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openrlworkers.openrl.io
spec:
  group: openrl.io
  names:
    kind: OpenRLWorker
    listKind: OpenRLWorkerList
    plural: openrlworkers
    shortNames:
    - orw
    singular: openrlworker
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.cohort
      name: Cohort
      type: string
    - jsonPath: .status.deviceCount
      name: GPUs
      type: integer
    - jsonPath: .status.memoryPerDevice
      name: MemEach
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.claimName
      name: Claim
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenRLWorker is the scheduling request for a single worker process.

          The caller does not create pods or ResourceClaims. It creates one
          OpenRLWorker per worker it wants, carrying the estimated memory and the
          cohort that governs sharing. The controller turns that into a ResourceClaim
          (matched or created) and a pod, and records what it picked in status.

          Splitting the request from the decision is what makes scheduling
          inspectable: `kubectl get openrlworkers` shows what was asked for, what it
          was placed on, and why a pending worker is still pending.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OpenRLWorkerSpec is one worker process's scheduling request.

              Four fields decide everything: who it is, where it may run, what it may run
              beside, and how much memory it needs. Memory arrives already estimated; the
              controller decides how many devices to spread it over and which claim to put
              it on, and never re-estimates.
            properties:
              cohort:
                description: |-
                  Cohort is the set of workers this one may hold the accelerators
                  alongside. Memory sums within a cohort; cohorts take turns.

                  The controller never interprets the string, it only compares it, so the
                  caller decides what sharing means. Several lora adapters over one frozen
                  base model name that base model. A full fine-tune shares nothing, leaves
                  this empty, and takes its turn alone -- which is the safe default,
                  because taking a turn always works and summing memory with strangers
                  does not.
                type: string
              container:
                description: Container is what the caller stamps onto the rendered
                  container.
                properties:
                  args:
                    description: Args are appended to the template's args.
                    items:
                      type: string
                    type: array
                  command:
                    description: Command replaces the template's command when non-empty.
                    items:
                      type: string
                    type: array
                  env:
                    description: Env entries are merged by name, overwriting the template's
                      values.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  image:
                    description: Image replaces the template's image when set.
                    type: string
                type: object
              memory:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Memory is the total accelerator memory this worker needs. When it exceeds
                  one device the model is laid out across as many as it takes, so this is an
                  aggregate and not a per-device figure.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              modelId:
                description: |-
                  ModelID is the open-rl model id this worker serves. It also determines
                  the pod name, so a repeated request reuses the existing worker.
                minLength: 1
                type: string
              podTemplate:
                description: |-
                  PodTemplate names the ConfigMap the worker pod is rendered from. When
                  unset the controller falls back to its role-default template.
                properties:
                  key:
                    default: pod.yaml
                    description: Key within the ConfigMap holding the pod YAML.
                    type: string
                  name:
                    description: Name of the ConfigMap in the controller's namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              role:
                description: |-
                  Role selects which node pools may host this worker. A node opts in per
                  role via openrl.io/trainer and openrl.io/sampler; a node that wants both
                  simply carries both labels.

                  Role does not partition claims. On a node that accepts both, a trainer
                  and a sampler can share one accelerator by taking turns.
                enum:
                - trainer
                - sampler
                type: string
            required:
            - memory
            - modelId
            - role
            type: object
          status:
            description: OpenRLWorkerStatus is what the controller decided and what
              came of it.
            properties:
              claimName:
                description: ClaimName is the ResourceClaim this worker was assigned
                  to.
                type: string
              conditions:
                description: Conditions holds the Placed condition and its history.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deviceCount:
                description: |-
                  DeviceCount is how many accelerators the controller decided this worker
                  spans. A decision, not a request: derived from Memory and the capacity
                  the pools registered.
                format: int32
                type: integer
              estimatedSwitchTime:
                description: |-
                  EstimatedSwitchTime is how long the timeslicer is expected to spend
                  parking this worker and restoring the next one, from the measured cost
                  model in internal/placement. Reported so an operator can see what a
                  shared claim costs before the slice quantum makes it obvious.
                type: string
              hostMemoryPerResident:
                description: |-
                  HostMemoryPerResident is the host RAM this worker occupies while parked.

                  cuda-checkpoint moves a suspended process's device memory into that
                  process's own host address space, so a worker costs its full accelerator
                  footprint in host RAM for as long as its cohort is not the one running.
                  This is what actually bounds how many residents a node can carry, and it
                  is why openrl.io/max-residents is a ceiling rather than the whole story.
                type: string
              memoryPerDevice:
                description: |-
                  MemoryPerDevice is what each of those devices must provide, i.e. Memory
                  divided by DeviceCount and rounded up.
                type: string
              nodeName:
                description: |-
                  NodeName is set only once the claim's allocation is observed. Until then
                  the node is genuinely unknown.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse summary; Conditions carry the detail.
                enum:
                - Pending
                - Placing
                - Running
                - Failed
                type: string
              podName:
                description: PodName is the worker pod, once created.
                type: string
              reason:
                description: Reason is the most recent human-readable explanation
                  of Phase.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
