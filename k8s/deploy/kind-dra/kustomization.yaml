apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kind variant of the FFT/DRA deployment, for running the workload scheduler
# against real GPUs on a single Linux GPU VM. See dev/kind/README.md.
#
# Differences from the GKE deployment:
#   - local-path PVC instead of an RWX Filestore class
#   - DCGM/PodMonitoring dropped (GKE-release image, gke-accelerator node
#     selector, and a Google Managed Prometheus CRD that does not exist here)
#   - the llm-d snapshot agent reads the driver from the node's own root rather
#     than COS's /home/kubernetes/bin/nvidia bundle
#   - images point at locally built tags in the cluster-local registry
#
# Container patches select local development images and their pull policies.
# The base uses upstream GHCR images; the API server worker-image env is patched
# separately because it is not a container image field.
#
# dev/kind/kind-cluster.yaml labels the single node as both a trainer and a
# sampler host, so the GKE manifests apply unmodified.
resources:
  - ../distributed-fft-timeslice

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    behavior: merge
    literals:
      # No Cloud Trace exporter on a local cluster.
      - ENABLE_GCP_TRACE="0"

patches:
  - path: pvc-local.yaml

  - target:
      kind: DaemonSet
      name: nvidia-dcgm-exporter
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: nvidia-dcgm-exporter
  - target:
      kind: ConfigMap
      name: dcgm-exporter-metrics
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dcgm-exporter-metrics
  - target:
      kind: PodMonitoring
      name: nvidia-dcgm-exporter-scraper
    patch: |
      $patch: delete
      apiVersion: monitoring.googleapis.com/v1
      kind: PodMonitoring
      metadata:
        name: nvidia-dcgm-exporter-scraper

  # The vendored llm-d chart mounts COS's driver bundle,
  # /home/kubernetes/bin/nvidia, and reads its libraries through
  # LD_LIBRARY_PATH=/usr/local/nvidia/lib64. That layout is GKE's. A kind node
  # keeps the driver in the ordinary system location, and the mount declares
  # `type: Directory`, so the kubelet refuses to invent the missing path and the
  # pod sits in ContainerCreating -- with empty logs, because the container never
  # starts. Repoint the same volume at the node's real driver root and drop the
  # lib64 suffix, since the libraries sit directly in the mounted directory.
  # dev/kind/create-cluster.sh installs the DRA driver with nvidiaDriverRoot=/
  # for the same reason.
  #
  # Patched by name, not by index: `volumes` merges on name and `env` on name,
  # so neither depends on the order the upstream chart happens to render. The
  # volumeMount is deliberately left alone -- that list merges on mountPath, so
  # naming a new one would append a second mount instead of moving the first.
  - target:
      kind: DaemonSet
      name: snapshot-agent
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: snapshot-agent
      spec:
        template:
          spec:
            containers:
              - name: snapshot-agent
                env:
                  - name: LD_LIBRARY_PATH
                    value: /usr/local/nvidia
            volumes:
              - name: nvidia-driver
                hostPath:
                  path: /usr/lib/x86_64-linux-gnu
                  type: Directory

  # Must match what dev/kind/load-images.sh builds and pushes.
  #
  # imagePullPolicy: Always throughout. The tag is mutable -- every iteration
  # republishes :kind-dev -- so the base's IfNotPresent would leave the kubelet
  # on the build it already cached and silently test the previous code. The
  # registry is one docker network away, so re-pulling costs nothing.
  - target:
      kind: DaemonSet
      name: open-rl-accel-timeslicer
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: open-rl-accel-timeslicer
      spec:
        template:
          spec:
            containers:
              - name: accel-timeslicer
                image: localhost:5001/open-rl-server:kind-dev
                imagePullPolicy: Always

  - target:
      kind: Deployment
      name: open-rl-api-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-rl-api-server
      spec:
        template:
          spec:
            containers:
              - name: api-server
                image: localhost:5001/open-rl-api-server:kind-dev
                imagePullPolicy: Always
                env:
                  # The worker image is a plain string in the Workload template
                  # the API server renders, out of reach of any image transformer,
                  # so this var is what decides the image every worker runs.
                  - name: OPEN_RL_WORKER_IMAGE
                    valueFrom: null
                    value: localhost:5001/open-rl-server:kind-dev
                  - name: OPEN_RL_DISPATCHER_IMAGE
                    valueFrom: null
                    value: localhost:5001/open-rl-api-server:kind-dev
                  # The API server also stamps the pull policy into each Workload.
                  - name: OPEN_RL_WORKER_IMAGE_PULL_POLICY
                    value: Always

  - target:
      kind: Deployment
      name: open-rl-scheduler
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-rl-scheduler
      spec:
        template:
          spec:
            containers:
              - name: manager
                image: localhost:5001/open-rl-scheduler:kind-dev
                imagePullPolicy: Always
