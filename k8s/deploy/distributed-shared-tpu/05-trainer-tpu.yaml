# Standing LoRA trainer worker on torch_tpu. Keeps the
# `app: open-rl-trainer-worker` label for the base overlay's service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer-tpu
  labels:
    app: open-rl-trainer-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-rl-trainer-worker
  template:
    metadata:
      labels:
        app: open-rl-trainer-worker
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: trainer
        image: open-rl-trainer-tpu
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-u", "-m", "server.training_requests_processor", "--model-id", "$(BASE_MODEL)", "--active-tenant-set-id", "$(BASE_MODEL)-1"]
        env:
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: OPEN_RL_BASE_MODEL
          value: "$(BASE_MODEL)"
        - name: OPEN_RL_ENABLE_FFT
          value: "false"
        - name: OPEN_RL_FINE_TUNING_TYPE
          value: "lora"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        - name: OPEN_RL_DEVICE
          value: "tpu"
        # torch_tpu recompiles per new shape; bucket to power-of-two rungs.
        - name: OPEN_RL_TRAIN_SHAPE_BUCKETS
          value: "1"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        resources:
          limits:
            google.com/tpu: "4"
            memory: "96Gi"
          requests:
            google.com/tpu: "4"
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x2
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
