# Pull-mode LoRA sampler on tpu-inference. Keeps the `app: vllm` label so the
# base overlay's vllm-service still selects it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampler-tpu
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: sampler
        image: open-rl-sampler-tpu
        imagePullPolicy: Always
        command: ["python3", "-u", "-m", "server.lora_sampler", "--model-id", "$(BASE_MODEL)"]
        env:
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: OPEN_RL_BASE_MODEL
          value: "$(BASE_MODEL)"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_ALLOW_INSECURE_SERIALIZATION
          value: "1"
        # Same engine shape as the single-VM e2e runs.
        - name: VLLM_MAX_MODEL_LEN
          value: "1024"
        - name: VLLM_MAX_NUM_SEQS
          value: "8"
        resources:
          limits:
            google.com/tpu: "4"
            memory: "96Gi"
          requests:
            google.com/tpu: "4"
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x2
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
