# Pod template the gateway uses to launch one sampler worker per model
# (server/k8s_worker_manager.py). All sampler worker pods reference the shared
# DRA ResourceClaim open-rl-sampler-gpu-1 (08-sampler-resourceclaim.yaml) and are
# placed onto the sampler GPU node. The node-local snapshot agent time-slices
# GPU access across concurrent inference engines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-rl-sampler-worker-pod-template
data:
  sampler-worker-pod.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      restartPolicy: OnFailure
      containers:
      - name: sampler-worker
        image: ghcr.io/gke-labs/open-rl/server:latest
        imagePullPolicy: IfNotPresent
        command: ["uv", "run", "python", "-u", "-m", "server.vllm_sampler"]
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379?max_connections=500"
        - name: OPEN_RL_ENABLE_FFT
          value: "true"
        - name: OPEN_RL_WEIGHT_SYNC_STRATEGY
          value: "delta"
        - name: OPEN_RL_WEIGHT_SYNC_DELTA_FORMAT
          value: "vllm_fused"
        - name: OPEN_RL_WEIGHT_SYNC_DELTA_APPLY_METHOD
          value: "patch_in_place"
        - name: VLLM_GPU_MEMORY_UTILIZATION
          value: "0.70"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_ALLOW_INSECURE_SERIALIZATION
          value: "1"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        - name: OPEN_RL_ACCEL_TIMESLICER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OPEN_RL_ACCEL_TIMESLICER_PORT
          value: "9753"
        resources:
          claims:
          - name: sampler-gpu
          limits:
            memory: "110Gi"
          requests:
            memory: "90Gi"
            cpu: "12"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      nodeSelector:
        group.timeslice.io/samplers: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
