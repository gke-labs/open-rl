# Node-local OpenRL accelerator time-slicer. One agent runs on each GPU node, owns the
# acquire/release queue for trainer worker pods placed on that node, and uses
# the llm-d snapshot-agent API for physical checkpoint/restore.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: open-rl-accel-timeslicer
  labels:
    app: open-rl-accel-timeslicer
spec:
  selector:
    matchLabels:
      app: open-rl-accel-timeslicer
  template:
    metadata:
      labels:
        app: open-rl-accel-timeslicer
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: group.timeslice.io/trainers
                operator: Exists
            - matchExpressions:
              - key: group.timeslice.io/samplers
                operator: Exists
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: accel-timeslicer
        image: gcr.io/cdrollouts-sunilarora/open-rl-server:0.1.11
        imagePullPolicy: IfNotPresent
        command: ["uv", "run", "python", "-m", "accel_timeslicer.serve"]
        args: ["--listen-host", "0.0.0.0", "--port", "9753", "--backend", "llmd", "--llmd-snapshot-endpoint", "127.0.0.1:9001"]
        ports:
        - name: snapshot
          containerPort: 9753
        resources:
          limits:
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
