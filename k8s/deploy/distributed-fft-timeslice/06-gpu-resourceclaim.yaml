# One DRA ResourceClaim for the trainer GPU allocation. Every trainer worker pod
# that references this claim is scheduled onto a node that can access the same
# allocated physical GPU(s).
#
# For single-GPU training (e.g. 0.5B, 1.7B models), request exactly 1 GPU.
# For multi-GPU sharded training (e.g. Qwen 4B+ models using FSDP / device_map="auto"),
# replace the `exactly:` block below with `count: 2` (or 4) to allocate multiple
# co-located physical GPUs on a multi-GPU node.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: open-rl-trainer-gpu-1
  labels:
    open-rl.io/workload-type: "full"
    open-rl.io/role: "trainer"
    open-rl.io/memory-tier: "80gb"
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.nvidia.com
        selectors:
        - cel:
            expression: device.attributes['gpu.nvidia.com'].productName == 'NVIDIA H100 80GB HBM3'
