# Node-local OpenRL snapshot agent. One agent runs on each GPU node, sees host
# PIDs, and coordinates checkpoint/restore for all trainer worker pods placed on
# that node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: open-rl-snapshot-agent
  labels:
    app: open-rl-snapshot-agent
spec:
  selector:
    matchLabels:
      app: open-rl-snapshot-agent
  template:
    metadata:
      labels:
        app: open-rl-snapshot-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: group.timeslice.io/trainers
                operator: Exists
            - matchExpressions:
              - key: group.timeslice.io/samplers
                operator: Exists
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: snapshot-agent
        image: ghcr.io/gke-labs/open-rl/server:latest
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-m", "snapshot_agent.serve"]
        args: ["--listen-host", "0.0.0.0", "--port", "9753", "--cuda-checkpoint-bin", "/usr/local/bin/cuda-checkpoint"]
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        ports:
        - name: snapshot
          containerPort: 9753
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia-driver
          mountPath: /usr/local/nvidia
          readOnly: true
        resources:
          limits:
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
      volumes:
      - name: nvidia-driver
        hostPath:
          path: /home/kubernetes/bin/nvidia
          type: DirectoryOrCreate
