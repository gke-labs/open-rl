# Pod template the gateway uses to launch one trainer worker per model
# (server/k8s_worker_manager.py). The launcher stamps metadata.name, the
# time-slicing coordination labels (snapshot-agent, timeslice.io/group,
# timeslice.io/job-id), the OPEN_RL_TIME_SLICE_JOB_ID env var, and appends
# --model-id to args. The current OpenRL snapshot client registers worker PIDs
# directly; the labels provide a stable per-model identity for coordination.
#
# All trainer worker pods in this group share one GPU through the single DRA
# ResourceClaim open-rl-trainer-gpu-1 (06-gpu-resourceclaim.yaml), which pins them
# to the same physical device. DRA does not serialize CUDA execution; OpenRL's
# node-local snapshot agent coordinates GPU windows. See
# docs/setup/gke-fft-timeslice.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-rl-trainer-worker-pod-template
data:
  trainer-worker-pod.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      restartPolicy: OnFailure
      # The node-local snapshot agent runs hostPID=true. This keeps the PID that
      # the worker registers meaningful to that host-level agent without adding
      # Kubernetes PID discovery in this PR.
      hostPID: true
      containers:
      - name: trainer-worker
        image: gcr.io/cdrollouts-sunilarora/open-rl-server:latest
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-m", "server.training_requests_processor"]
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: OPEN_RL_ENABLE_FFT
          value: "true"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        # Debug only: set OPEN_RL_SNAPSHOT_AGENT_MODE=noop here to bypass
        # checkpoint/restore coordination while measuring raw oversubscription.
        - name: OPEN_RL_SNAPSHOT_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OPEN_RL_SNAPSHOT_AGENT_PORT
          value: "9753"
        - name: OPEN_RL_TIME_SLICE_GROUP
          value: "trainers"
        resources:
          claims:
          - name: trainer-gpu
          limits:
            memory: "20Gi"
          requests:
            # Sized generously for model load and optimizer state; increase this
            # if a future coordination layer checkpoints GPU state to host RAM.
            memory: "16Gi"
            cpu: "2"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      resourceClaims:
      - name: trainer-gpu
        resourceClaimName: open-rl-trainer-gpu-1
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      nodeSelector:
        group.timeslice.io/trainers: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
