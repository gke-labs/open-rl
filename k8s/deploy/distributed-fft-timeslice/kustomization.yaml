apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FFT deployment: the API server creates one Workload per worker process and the
# scheduler turns each into a DRA ResourceClaim and a pod. There is no static
# trainer worker in this variant.
# One namespace for the whole stack. The API server creates Workloads in its own
# namespace and the scheduler watches its own, and the scheduler runs as the
# open-rl-sa this stack creates, so all three must agree. The scheduler base
# pins openrl-system on its own; this makes the rest of the stack match it.
namespace: openrl-system

resources:
  - ../base
  - ../fft-runtime
  - 01-shared-pvc.yaml
  - 10-dcgm-monitoring.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    behavior: merge
    literals:
      - BASE_MODEL="Qwen/Qwen2.5-0.5B"
      - ENABLE_GCP_TRACE="1"
      - OPEN_RL_WEIGHT_SYNC_STRATEGY="delta"

images:
  - name: ghcr.io/gke-labs/open-rl/server
    newTag: latest
  - name: ghcr.io/gke-labs/open-rl/api-server
    newTag: latest

# FFT remains an optional deployment with cooperative GPU sharing.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-rl-api-server
      spec:
        template:
          spec:
            containers:
              - name: api-server
                env:
                  - name: OPEN_RL_ENABLE_FFT
                    value: "true"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-rl-scheduler
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: OPEN_RL_PLACEMENT_STRATEGY
                    value: binpack
