apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LoRA and full fine-tuning on GKE TPU nodes served by the TPU DRA driver, on
# a TPU-only cluster or one that also has GPU nodes. k8s/deploy/fft plus the
# TPU images; the scheduler's built-in TPU defaults need no settings. Models
# run on TPU when the client sets the openrl.*_accel_prefs settings, on GPU
# otherwise. Full fine-tuning on TPU runs only for models with
# openrl.exclusive=true, each worker on its own node. The GPU time slicer and
# snapshot agent select nvidia.com/gpu.present, so on a TPU-only cluster they
# run no pods.
namespace: openrl-system
resources:
  - ../fft

# The TPU images are not published. Point the placeholders at your builds with
# an `images:` entry, e.g. `kustomize edit set image TPU-TRAINER-IMAGE=<image>`.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: open-rl-images
    behavior: merge
    literals:
      - tpu-trainer=TPU-TRAINER-IMAGE
      - tpu-sampler=TPU-SAMPLER-IMAGE

configurations:
  - images.yaml

patches:
  - path: api-server.yaml
