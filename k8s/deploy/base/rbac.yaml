# The API server requests one Workload per worker process; the scheduler owns the
# pods and claims from there. It also manages each sampling pool's CPU pod and
# lists sampler pods, because a sampler is ready only once its pod is Ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-worker-launcher
rules:
- apiGroups: ["openrl.io"]
  resources: ["workloads"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "list", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-worker-launcher
subjects:
- kind: ServiceAccount
  name: open-rl-sa
roleRef:
  kind: Role
  name: open-rl-worker-launcher
  apiGroup: rbac.authorization.k8s.io
---
# A pool's dispatcher and EPP find its samplers by label, ready or not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-rl-sampler-dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-sampler-dispatcher
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-sampler-dispatcher
subjects:
- kind: ServiceAccount
  name: open-rl-sampler-dispatcher
roleRef:
  kind: Role
  name: open-rl-sampler-dispatcher
  apiGroup: rbac.authorization.k8s.io
