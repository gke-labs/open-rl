# The router of every sampling pool's CPU pod. Envoy asks the pod's llm-d EPP
# (ext_proc on 9002) for a sampler and connects to the one the EPP names; it never
# routes without the EPP. The response names the sampler that answered, so the
# dispatcher can check its weight version before committing. The EPP keeps a request
# on the replicas that hold its prefix (precise matching from each pod's KV events)
# until their in-flight load would cost more time to first token than a cold replica,
# llm-d's "sticky until saturated". Prefix weighting alone piles long decodes onto one
# replica, and the slowest decode sets an RL step's time. No token producer is declared
# because the dispatcher sends token IDs to vLLM's /inference/v1/generate, and the one
# the EPP creates by default passes them through unchanged, so a vLLM renderer adds nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-rl-sampler-router
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: inference
          address: {socket_address: {address: 127.0.0.1, port_value: 8081}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inference
                    # A long generation sends nothing until it finishes, so no idle timeout may cut it off.
                    stream_idle_timeout: 0s
                    route_config:
                      virtual_hosts:
                        - name: samplers
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: samplers, timeout: 0s, idle_timeout: 0s}
                              response_headers_to_add:
                                - header: {key: x-openrl-upstream, value: "%UPSTREAM_HOST%"}
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc: {cluster_name: epp, authority: localhost:9002}
                            timeout: 10s
                          processing_mode:
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 1000s
                      - name: envoy.filters.http.router
                        typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
      clusters:
        - name: samplers
          type: ORIGINAL_DST
          lb_policy: CLUSTER_PROVIDED
          connect_timeout: 10s
          original_dst_lb_config: {use_http_header: true, http_header_name: x-gateway-destination-endpoint}
        - name: epp
          connect_timeout: 10s
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context: {validation_context: {}}
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config: {http2_protocol_options: {}}
          load_assignment:
            cluster_name: epp
            endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9002}}}}]}]
  epp.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: endpoint-notification-source
      - type: precise-prefix-cache-producer
      - type: inflight-load-producer
        parameters: {prefixMatchInfoProducerName: precise-prefix-cache-producer}
      - type: prefix-cache-affinity-filter
        parameters: {prefixMatchInfoProducerName: precise-prefix-cache-producer}
      - type: token-load-scorer
    dataLayer:
      sources:
        - pluginRef: endpoint-notification-source
          extractors: [{pluginRef: precise-prefix-cache-producer}]
