apiVersion: v1
kind: Service
metadata:
  name: open-rl-api-server-service
  labels:
    app: open-rl-api-server
spec:
  selector:
    app: open-rl-api-server
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-rl-api-server
  labels:
    app: open-rl-api-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-rl-api-server
  template:
    metadata:
      labels:
        app: open-rl-api-server
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: api-server
        image: ghcr.io/gke-labs/open-rl/api-server:latest
        imagePullPolicy: IfNotPresent
        command: ["uv", "run", "uvicorn", "server.api_server:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        env:
        - name: ENABLE_GCP_TRACE
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: ENABLE_GCP_TRACE
        - name: REDIS_URL
          value: "redis://redis-service:6379?max_connections=500"
        # Default model advertised by the API server.
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        # vLLM's compile cache, shared by every sampler in the fleet: the first
        # sampler of a model on a GPU type compiles (about a minute), the rest
        # load the result in a second. Unset it to keep a per-node hostPath instead.
        - name: OPEN_RL_VLLM_CACHE_DIR
          value: "/mnt/shared/open-rl/vllm-cache"
        # vLLM sampling enabled on cluster.
        - name: SAMPLING_BACKEND
          value: "vllm"
        - name: OPEN_RL_ENABLE_FFT
          value: "false"
        # One Workload object per worker; the scheduler picks the claim and
        # renders the pod.
        - name: OPEN_RL_WORKER_MANAGER
          value: "scheduler"
        - name: OPEN_RL_WORKER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPEN_RL_WORKER_IMAGE
          valueFrom:
            configMapKeyRef:
              name: open-rl-images
              key: worker
        resources:
          limits:
            memory: "2Gi"
          requests:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /api/v1/healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
