# Node-local OpenRL accelerator time-slicer. One agent runs on each GPU node, owns the
# acquire/release queue for trainer worker pods placed on that node, and uses
# the llm-d snapshot-agent API for physical checkpoint/restore.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: openrl-node-daemon
value: 1000000
globalDefault: false
description: >-
  Node daemons every OpenRL worker on the node depends on. Outranks workers
  so a daemon can always schedule, even on a node workers have filled.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: open-rl-accel-timeslicer
  labels:
    app: open-rl-accel-timeslicer
spec:
  selector:
    matchLabels:
      app: open-rl-accel-timeslicer
  template:
    metadata:
      labels:
        app: open-rl-accel-timeslicer
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Follows the same marker every DRA GPU pool must carry (and the same
      # selector the llm-d snapshot agent uses), so a new pool gets its
      # daemon without a bespoke labeling step -- forgetting the old
      # group.timeslice.io labels once cost four trainers an hour of
      # crash-looping against a node with no daemon.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Outranks workers so the daemon always fits: two 28Gi trainers once
      # filled a node before its daemon could schedule 512Mi, and the gated
      # workers then waited on a daemon that could never start.
      priorityClassName: openrl-node-daemon
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: accel-timeslicer
        image: ghcr.io/openrl-dev/openrl/server:latest
        imagePullPolicy: IfNotPresent
        command: ["uv", "run", "python", "-m", "accel_timeslicer.serve"]
        args: ["--listen-host", "0.0.0.0", "--port", "9753", "--backend", "llmd", "--llmd-snapshot-endpoint", "127.0.0.1:9001", "--scheduling-policy", "lrs"]
        ports:
        - name: snapshot
          containerPort: 9753
        resources:
          limits:
            memory: "1Gi"
          requests:
            cpu: "250m"
            # Small enough to fit beside two full-sized workers; the daemon
            # coordinates handoffs, it does not hold model state.
            memory: "256Mi"
