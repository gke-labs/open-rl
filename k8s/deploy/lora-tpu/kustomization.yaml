apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LoRA on GKE TPU nodes served by the TPU DRA driver. Same control plane as
# k8s/deploy/lora; the scheduler's built-in TPU defaults need no settings.
# Models run on TPU when the client sets the openrl.*_accel_prefs settings.
namespace: openrl-system
resources:
  - ../lora

# The TPU images are not published. Point the placeholders at your builds with
# an `images:` entry, e.g. `kustomize edit set image TPU-TRAINER-IMAGE=<image>`.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: open-rl-images
    behavior: merge
    literals:
      - tpu-trainer=TPU-TRAINER-IMAGE
      - tpu-sampler=TPU-SAMPLER-IMAGE
  # Env for TPU worker pods only, sized for one 32 GB v6e chip.
  - name: open-rl-tpu-worker-env
    literals:
      - VLLM_MAX_MODEL_LEN=2048
      - VLLM_MAX_NUM_SEQS=64
      - OPEN_RL_TRAIN_TOKEN_BUDGET=32768

configurations:
  - images.yaml

patches:
  - path: api-server.yaml
