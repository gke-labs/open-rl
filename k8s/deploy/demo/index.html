<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRL</title>
<style>
  :root { --bg:#0F1113; --ink:#F2EEDE; --soft:#C9C6BA; --faint:#7D7B72; --line:#2A2D31; --tile:#1A1D21; --tileOn:#23272C;
          --lora:#2CC2AE; --loraSoft:#17433D; --fft:#E9743A; --fftSoft:#4A2A18; --api:#4D95E8; --wait:#E6C230; --ok:#4CC27A; --bad:#E05A4F; --term:#0B0D0F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font:15px/1.45 "Avenir Next","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
  .mono { font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
  header { display:flex; align-items:center; gap:18px; padding:14px 28px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; font-weight:700; cursor:pointer; }
  header h1 span { color:var(--faint); font-weight:500; margin-left:8px; }
  nav button { background:none; border:0; color:var(--faint); font:inherit; font-size:16px; padding:6px 12px; cursor:pointer; border-radius:6px; }
  nav button.on { color:var(--ink); background:var(--tile); }
  header .right { margin-left:auto; color:var(--faint); font-size:13px; }
  main { padding:20px 28px; }
  .tab { display:none; } .tab.on { display:block; }
  /* sweep */
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  input, select { background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; font-size:14px; }
  input[type=number] { width:80px; }
  button.act { background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer; }
  button.act:hover { border-color:var(--faint); }
  button.primary { background:var(--lora); color:#06211D; border-color:var(--lora); font-weight:600; }
  button.danger { color:var(--bad); border-color:#5a2b27; }
  button.small { padding:3px 9px; font-size:12px; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; color:var(--faint); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:14px; }
  .spec td input, .spec td select { width:100%; }
  .spec td.n input { width:80px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:start; }
  /* the recipe every job runs, under the spec: one card per property, the value large and its meaning under it */
  .recipe { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-top:22px; }
  .recipe .card { background:var(--tile); border-radius:10px; padding:14px 16px 13px; min-height:104px; }
  .recipe .k { color:var(--faint); font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .recipe .v { font-size:26px; font-weight:700; line-height:1.15; margin:6px 0 4px; white-space:nowrap; }
  .recipe .v small { font-size:15px; font-weight:600; color:var(--soft); margin-left:4px; }
  .recipe .d { color:var(--soft); font-size:13px; line-height:1.35; }
  .recipe .card.sum { background:var(--tileOn); }
  .log { background:var(--term); border:1px solid var(--line); border-radius:8px; padding:14px 16px; height:420px; overflow:auto; font-size:13px; line-height:1.6; color:var(--soft); }
  .log .c { color:var(--ink); } .log .t { color:var(--faint); margin-right:8px; } .log .g { color:var(--api); } .log .q { color:var(--ink); } .log .l { color:var(--lora); } .log .f { color:var(--fft); }
  .st { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .st.queued,.st.submitting { color:var(--faint); } .st.waiting { color:var(--wait); } .st.starting { color:var(--api); } .st.running { color:var(--ink); border-color:var(--soft); } .st.done { color:var(--ok); } .st.failed { color:var(--bad); }
  .bar { position:relative; width:160px; height:14px; background:var(--tile); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
  .bar i { position:absolute; left:0; top:0; bottom:0; }
  /* fleet */
  .stage-wrap { display:grid; place-items:center; --u:min(calc((100vw - 56px) / 100), calc((100vh - 110px) / 56.25)); }
  .stage { position:relative; width:calc(var(--u) * 100); height:calc(var(--u) * 56.25); background:var(--bg); overflow:hidden; border:1px solid var(--line); border-radius:10px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hint { color:var(--faint); font-size:13px; margin-top:10px; }
  /* presentation mode (p, or #…?present=1): the canvas fills the screen; the header slides in from the top edge */
  body.present header { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bg); transform:translateY(-100%); transition:transform .25s cubic-bezier(.25,.8,.25,1); }
  body.present header::after { content:""; position:absolute; left:0; right:0; bottom:-16px; height:16px; }
  body.present header:hover { transform:none; }
  body.present main { padding:0; }
  body.present .tab > .row, body.present .tab > .hint { display:none; }
  body.present .stage-wrap { height:100vh; --u:min(1vw, calc(100vh / 56.25)); }
  body.present .stage { border:0; border-radius:0; }
  body.present #tab-sweep { padding:20px 28px; }
</style>
</head>
<body>
<header>
  <h1 id="home" title="Home">OpenRL</h1>
  <nav><button data-tab="sweep" class="on">Sweep</button><button data-tab="fleet">Fleet</button><button data-tab="timeline">Timeline</button><button data-tab="weights">Weights</button><button data-tab="metrics">Metrics</button></nav>
  <div class="right" id="conn">connecting</div>
</header>
<main>
  <section class="tab on" id="tab-sweep">
    <div class="row">
      <label>run <input id="run" class="mono" value="" size="16"></label>
      <span style="color:var(--faint)">presets</span><span id="presets"></span>
      <button class="act" id="addrow">Add row</button>
      <span style="flex:1"></span>
      <button class="act primary" id="start">Start sweep</button>
      <button class="act danger" id="stopall">Stop all</button>
    </div>
    <div class="grid">
      <div>
        <table class="spec" id="spec"><thead><tr><th>type</th><th>model</th><th>count</th><th>steps</th><th>first seed</th><th></th></tr></thead><tbody></tbody></table>
        <div class="recipe" id="recipe"></div>
        <datalist id="models"><option value="google/gemma-4-e2b"><option value="Qwen/Qwen3-0.6B"><option value="Qwen/Qwen2.5-0.5B-Instruct"></datalist>
      </div>
      <div class="log mono" id="log"></div>
    </div>
    <!-- collapsed by default, so the page before a launch shows only the spec, not the jobs of earlier sweeps -->
    <details id="jobs-box"><summary style="margin:22px 0 8px;font-size:15px;font-weight:600;color:var(--soft);cursor:pointer;user-select:none">Jobs</summary>
    <table id="jobs"><thead><tr><th>sweep</th><th>#</th><th>job</th><th>model</th><th>type</th><th>seed</th><th>state</th><th>steps</th><th>run</th><th>views</th><th></th></tr></thead><tbody></tbody></table></details>
  </section>
  <section class="tab" id="tab-fleet">
    <div class="row" style="margin-bottom:10px"><label>sweep <select id="fleet-run"><option value="">all</option></select></label></div>
    <div class="stage-wrap"><div class="stage"><canvas id="fleet"></canvas></div></div></section>
  <section class="tab" id="tab-timeline">
    <div class="row">
      <label>accelerator <select id="tl-gpu"><option value="">—</option></select></label>
      <label>job <select id="tl-job"><option value="">—</option></select></label>
      <label>window <select id="tl-win"><option value="fit" selected>fit</option><option value="900">15 min</option><option value="1800">30 min</option><option value="3600">1 h</option><option value="sweep">this sweep</option></select></label>
      <label id="tl-others-wrap" style="display:none"><input type="checkbox" id="tl-others"> overlay other jobs on these GPUs</label>

    </div>
    <div class="stage-wrap"><div class="stage"><canvas id="timeline"></canvas></div></div>
  </section>
  <section class="tab" id="tab-weights">
    <div class="row">
      <label>job <select id="wt-job"><option value="">—</option></select></label>

    </div>
    <div class="stage-wrap"><div class="stage"><canvas id="weights"></canvas></div></div>
  </section>
  <section class="tab" id="tab-metrics">
    <div class="row">
      <label>sweep <select id="mt-sweep"></select></label>
      <label>job <select id="mt-job"><option value="">all jobs</option></select></label>

    </div>
    <div class="stage-wrap"><div class="stage"><canvas id="metrics"></canvas></div></div>
  </section>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const T = { bg:'#0F1113', ink:'#F2EEDE', soft:'#C9C6BA', faint:'#7D7B72', line:'#2A2D31', tile:'#1A1D21', tileOn:'#23272C', lora:'#2CC2AE', loraSoft:'#17433D', fft:'#E9743A', fftSoft:'#4A2A18', api:'#4D95E8', wait:'#E6C230', ok:'#4CC27A', bad:'#E05A4F' };
  const SANS = '"Avenir Next","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif', MONO = '"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
  const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b,x));
  const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const short = m => (m||'').split('/').pop().toLowerCase();
  const api = async (p, opts) => { const r = await fetch(p, opts); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };

  // ---- motion: the screen eases toward each poll instead of snapping to it
  // Polls land every 1 to 2 s; a count, a bar or a chip that jumps on a big screen reads as a glitch. Every drawn value
  // that changes goes through one of these, keyed by what it is (a job's bar, a GPU's border), so it moves from where it
  // was. A value seen for the first time, or during a quiet spell (page load, tab switch), is drawn where it is.
  var MO = { v: new Map(), seen: new Map(), rolls: new Map(), now: performance.now() / 1000, dt: 0, quietUntil: performance.now() / 1000 + 1.5 };
  const quiet = () => MO.now < MO.quietUntil;
  function tick() { const n = performance.now() / 1000; MO.dt = Math.min(0.1, n - MO.now); MO.now = n;
    if (Math.floor(n) % 5 === 0 && MO.pruned !== Math.floor(n)) { MO.pruned = Math.floor(n); for (const [k, t] of MO.seen) if (n - t > 8) { MO.seen.delete(k); MO.v.delete(k); MO.rolls.delete(k); } } }
  // exponential approach: about 95% of the way in 3 * tau seconds, from wherever the value is now
  function approach(key, target, tau = 0.16, from) {
    let v = MO.v.get(key); if (v === undefined) v = from === undefined || quiet() ? target : from;
    v += (target - v) * (1 - Math.exp(-MO.dt / tau)); if (Math.abs(target - v) < 1e-3) v = target;
    MO.v.set(key, v); MO.seen.set(key, MO.now); return v;
  }
  // cubic-bezier easing; travel uses (0.45, 0, 0.1, 1), arrivals (0.25, 0.8, 0.25, 1)
  function bezier(x1, y1, x2, y2) { const f = (t, a, b) => 3*a*t*(1-t)*(1-t) + 3*b*t*t*(1-t) + t*t*t;
    return x => { x = clamp(x); let t = x; for (let i = 0; i < 8; i++) { const d = (f(t + 1e-4, x1, x2) - f(t, x1, x2)) / 1e-4; if (!d) break; t = clamp(t - (f(t, x1, x2) - x) / d); } return f(t, y1, y2); }; }
  const travel = bezier(0.45, 0, 0.1, 1), arrive = bezier(0.25, 0.8, 0.25, 1);
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function mix(a, b, k) { const p = hexRgb(a), q = hexRgb(b); return `rgb(${p.map((x, i) => Math.round(x + (q[i] - x) * clamp(k))).join(',')})`; }

  // ---- tabs
  function showTab(name) {
    const b = document.querySelector(`nav button[data-tab="${name}"]`); if (!b) return;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + name));
    if (!location.hash.startsWith('#' + name)) history.replaceState(null, '', '#' + name + (document.body.classList.contains('present') ? '?present=1' : ''));
    if (MO) MO.quietUntil = performance.now() / 1000 + 0.3;  // a tab that comes back shows where things are, not a replay
    if (name === 'weights' && typeof wt !== 'undefined' && !wt.job && tl.kind === 'job') { wt.job = tl.id; wtSel.value = tl.id; }
    if (name === 'metrics' && typeof mt !== 'undefined') mt.fetchedAt = 0;
  }
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $('#home').onclick = () => showTab('sweep');
  // presentation mode: p toggles it, 1 to 5 switch tabs, Escape leaves it (outside text fields)
  const TABS = ['sweep', 'fleet', 'timeline', 'weights', 'metrics'];
  function setPresent(on) { document.body.classList.toggle('present', on); dispatchEvent(new Event('resize')); }
  if (/[?&]present=1/.test(location.hash) || new URLSearchParams(location.search).get('present') === '1') setPresent(true);
  addEventListener('keydown', e => {
    if (e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'p') setPresent(!document.body.classList.contains('present'));
    else if (e.key === 'Escape' && document.body.classList.contains('present') && !tl.sel) setPresent(false);
    else if (e.key >= '1' && e.key <= '5') showTab(TABS[+e.key - 1]);
  });
  addEventListener('hashchange', () => showTab((location.hash.slice(1) || 'sweep').split('?')[0]));
  if (location.hash) showTab(location.hash.slice(1).split('?')[0]);

  // ---- sweep: spec editor
  const spec = $('#spec tbody');
  function addRow(r = { kind:'fft', model:'Qwen/Qwen3-0.6B', count:1, steps:4, seed:1 }) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><select><option value="lora"${r.kind==='lora'?' selected':''}>lora</option><option value="fft"${r.kind==='fft'?' selected':''}>full</option></select></td>
      <td><input list="models" value="${r.model}"></td><td class="n"><input type="number" min="1" max="40" value="${r.count}"></td>
      <td class="n"><input type="number" min="1" max="100" value="${r.steps}"></td><td class="n"><input type="number" min="0" value="${r.seed}"></td>
      <td><button class="act small">remove</button></td>`;
    tr.querySelector('button').onclick = () => tr.remove();
    spec.appendChild(tr);
  }
  function readSpec() {
    return [...spec.querySelectorAll('tr')].map(tr => { const [k, m, c, s, d] = tr.querySelectorAll('select,input'); return { kind:k.value, model:m.value.trim(), count:+c.value, steps:+s.value, seed:+d.value }; }).filter(r => r.model && r.count > 0);
  }
  $('#addrow').onclick = () => addRow();
  // the recipe cards; the last one sums up the spec as it is edited
  let recipe = null;
  function renderRecipe() {
    if (!recipe) return;
    const R = recipe, perStep = R.group_size * R.groups_per_batch, rows = readSpec();
    const jobs = rows.reduce((a, r) => a + r.count, 0), steps = rows.reduce((a, r) => a + r.count * r.steps, 0);
    const models = new Set(rows.map(r => r.model)).size, fmt = n => n.toLocaleString('en-US');
    const lr = (k, c) => `<span style="color:var(--${c})">${k}</span>`;
    const cards = [
      ['task', `${R.dataset}`, 'grade-school math word problems; reward 1 for the right final answer'],
      ['algorithm', 'GRPO', `answers scored against their group's mean; ${R.loss.replace(' ', '-')} loss, no KL`],
      ['each step', `${R.groups_per_batch} × ${R.group_size}<small>= ${perStep} answers</small>`, `${R.groups_per_batch} problems, ${R.group_size} sampled answers to each`],
      ['sampling', `${R.max_tokens}<small>tokens max</small>`, `temperature ${R.temperature.toFixed(1)}`],
      ['learning rate', `${R.learning_rate.lora}<small>${lr('lora', 'lora')}</small> ${R.learning_rate.fft}<small>${lr('full', 'fft')}</small>`, `LoRA rank ${R.lora_rank}; full fine-tuning updates every weight`],
      ['this sweep', `${jobs} jobs`, jobs ? `${fmt(steps)} steps, ${fmt(steps * perStep)} answers, ${models} model${models === 1 ? '' : 's'}` : 'add a row to the spec'],
    ];
    $('#recipe').innerHTML = cards.map(([k, v, d], i) => `<div class="card${i === cards.length - 1 ? ' sum' : ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');
  }
  $('#spec').addEventListener('input', renderRecipe); $('#spec').addEventListener('click', () => setTimeout(renderRecipe));
  $('#addrow').addEventListener('click', () => setTimeout(renderRecipe));
  // a fresh run name per sweep: Job names come from it, and a name that already has Jobs submits nothing
  const freshRun = () => { $('#run').value = 'sweep-' + new Date().toISOString().slice(11,19).replace(/:/g,''); };
  freshRun();
  api('/api/sweep/presets').then(R => {
    env = { namespace: R.namespace || '', cluster: R.cluster || '' }; const P = R.presets;
    for (const name of Object.keys(P)) {
      const b = document.createElement('button'); b.className = 'act small'; b.textContent = name;
      b.onclick = () => { spec.innerHTML = ''; P[name].jobs.forEach(j => addRow({ seed:1, ...j })); renderRecipe(); };
      $('#presets').appendChild(b);
    }
    spec.innerHTML = ''; P['mixed-20'].jobs.forEach(j => addRow({ seed:1, ...j }));
    recipe = R.recipe || null; renderRecipe();
  });

  // ---- sweep: log and actions
  const log = $('#log');
  function say(html) { const d = document.createElement('div'); d.innerHTML = `<span class="t">${new Date().toISOString().slice(11,19)}</span>${html}`; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  $('#start').onclick = async () => {
    const jobs = readSpec(); if (!jobs.length) return say('<span class="c">nothing to start</span>');
    const n = jobs.reduce((a, j) => a + j.count, 0);
    say(`<span class="c">$ openrl sweep start --run ${$('#run').value} --jobs ${n}</span>`);
    sweepStart = Date.now() / 1000;
    // The Fleet tab follows the new sweep from the click, not from the reply, which comes only once every Job exists
    // (one every 0.3 s). Until its first Job shows up it holds on the empty pool, not on the previous sweep.
    pendingRun = $('#run').value.toLowerCase().replace(/[^a-z0-9-]/g, '-').slice(0, 30).replace(/^-+|-+$/g, '');
    fleetRun = null; fleetRunSel.value = '';
    try { const r = await api('/api/sweep/start', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ run: $('#run').value, jobs }) });
      if (!r.created.length) pendingRun = null;
      if (r.created.length) say(`<span class="c">${r.created.length} jobs submitted. Same loop in every one; only the model, the tuning mode and the seed differ.</span>`);
      if ((r.skipped || []).length) say(`<span class="f">${r.skipped.length} job${r.skipped.length === 1 ? '' : 's'} not submitted: run ${r.run} already has ${r.skipped.length === 1 ? 'a Job' : 'Jobs'} by ${r.skipped.length === 1 ? 'that name' : 'those names'}. Start again with the new run name.</span>`);
      freshRun(); }
    catch (e) { pendingRun = null; say(`<span class="f">${e.message}</span>`); }
  };
  $('#stopall').onclick = async () => { say('<span class="c">$ openrl sweep stop --all</span>'); const r = await api('/api/sweep/stop_all', { method:'POST' }); say(`<span class="c">stopped ${r.stopped.length}: workers released ${r.stopped.filter(s => s.released).length}</span>`); };

  // ---- state
  let jobsList = [], fleetJobs = [], latestRun = null, fleetRun = null, fleetScope = null, runs = {}, inventory = null, seen = new Set(), sweepStart = null;
  let env = { namespace: '', cluster: '' };  // from /api/sweep/presets
  // pendingRun: a sweep just started whose first Job has not appeared yet (see #start)
  let pendingRun = null;
  const fleetRunSel = $('#fleet-run'); fleetRunSel.onchange = () => { fleetRun = fleetRunSel.value || null; pendingRun = null; };
  // The Fleet tab opens on the idle fleet (no sweep's jobs or counts), the opening shot of a demo; starting a sweep
  // switches it to the active sweeps. ?sweep=active, ?sweep=all or ?sweep=<run> opens on that instead.
  { const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.split('?')[1] || ''), w = q.get('sweep') || h.get('sweep');
    fleetRun = !w || w === 'none' ? '-' : w === 'active' ? null : w === 'all' ? '*' : w; }
  const sweepLetter = new Map(); let backlogSeen = false;
  const tag = j => `${sweepLetter.get(j.run) || ''}${String(jobIndex.get(j.name)).padStart(2,'0')}`;  // A15: sweep letter + job number
  const jobIndex = new Map();
  function stateOf(j) {
    const run = j.run_id ? runs[j.run_id] : null;
    if (j.state === 'failed') return 'failed';
    if (j.state === 'succeeded' || (run && run.lifecycle === 'ended')) return 'done';
    if (!run) return j.pod_phase === 'Running' ? 'submitting' : 'queued';
    if (run.lifecycle === 'waiting') return 'waiting';
    // placed: the run's workers hold GPUs and are sampling or training; the steps bar says how far along. A first
    // step can take minutes when many jobs share the GPUs, so steps alone would read 'starting' far too long.
    if (run.lifecycle === 'placed' || run.lifecycle === 'active' || (run.steps || 0) > 0) return 'running';
    return 'starting';
  }
  // Each source on its own clock, so a slow one never holds the others back. The inspection API caches its
  // fleet snapshot for 5 s; Jobs and Workloads are read live from Kubernetes every second.
  let inflight = {};
  function every(ms, key, fn) { const tick = async () => { if (inflight[key]) return; inflight[key] = true; try { await fn(); } catch (e) { $('#conn').textContent = 'disconnected: ' + e.message; } finally { inflight[key] = false; } }; setInterval(tick, ms); tick(); }
  // /runs reads several keys per run from the API server's own Redis pool, the one its training clients use. Live runs
  // are few and change fast; ended runs are many and final. Separate clocks keep the page from starving the data path.
  every(2000, 'runs', async () => { const R = await api('/api/inspect/runs'); R.runs.forEach(r => { runs[r.run_id] = r; }); });
  every(15000, 'runs-ended', async () => { const R = await api('/api/inspect/runs?ended=true'); runs = Object.fromEntries(R.runs.map(r => [r.run_id, r])); });
