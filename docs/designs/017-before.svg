<svg viewBox="0 0 1100 470" class="arch" role="img" aria-labelledby="bt" xmlns="http://www.w3.org/2000/svg"><title id="bt">Before: one queue per model, no router</title>
<style>.arch{width:100%;height:auto;display:block;background:#fbfcfd}
.box rect{fill:#fff;stroke:#9aa3ae;stroke-width:1.2}.box.store rect{fill:#f3f5f8}.box.gpu rect{fill:#eef4fb;stroke:#7d9cc4}.box.accent rect{fill:#efedfa;stroke:#2f2a8a;stroke-width:1.6}
.group{fill:none;stroke:#b9c0c8;stroke-width:1.2;stroke-dasharray:5 4}.cluster{fill:none;stroke:#7a828d;stroke-width:1.4}
.bt{font-size:14px;font-weight:600;fill:#16191d;text-anchor:middle}.bs{font-size:12px;fill:#4d5560;text-anchor:middle}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#2f2a8a;text-anchor:middle}
.gt{font-size:13px;font-weight:600;fill:#4d5560}.ct{font-size:15px;font-weight:650;fill:#16191d}
.flow{fill:none;stroke:#16191d;stroke-width:1.4}.side{fill:none;stroke:#8a929c;stroke-width:1.3;stroke-dasharray:4 3}
.ahead{fill:#16191d}.lbl{font-size:11.5px;fill:#4d5560;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px;stroke-linejoin:round}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>

<g class="box"><rect x="16" y="150" width="130" height="70" rx="6"/><text x="81" y="178" class="bt">Training loop</text><text x="81" y="196" class="bs">tinker SDK</text></g>
<rect x="176" y="16" width="908" height="440" rx="12" class="cluster"/><text x="196" y="44" class="ct">GKE cluster</text>

<g class="box accent"><rect x="200" y="140" width="170" height="92" rx="6"/><text x="285" y="166" class="bt">API server</text><text x="285" y="184" class="bs">ensure(model, "sampler")</text><text x="285" y="200" class="bs">waits ≤300 s for</text><text x="285" y="215" class="bs">sampler_ready</text></g>

<g class="box"><rect x="430" y="64" width="190" height="60" rx="6"/><text x="525" y="88" class="bt">Sampler Workload</text><text x="525" y="106" class="bs">one per replica</text></g>
<g class="box"><rect x="680" y="64" width="190" height="60" rx="6"/><text x="775" y="88" class="bt">OpenRL scheduler</text><text x="775" y="106" class="bs">DRA claim, then pod</text></g>

<g class="box store"><rect x="430" y="300" width="250" height="78" rx="6"/><text x="555" y="326" class="bt">Redis list, one per model</text><text x="555" y="346" class="mono">open_rl:sampler_queue:&lt;model_id&gt;</text><text x="555" y="364" class="bs">a pop removes the request</text></g>
<g class="box store"><rect x="200" y="300" width="170" height="78" rx="6"/><text x="285" y="326" class="bt">Results</text><text x="285" y="346" class="mono">open_rl:future:&lt;id&gt;</text></g>

<rect x="720" y="168" width="340" height="268" rx="10" class="group"/><text x="1044" y="190" class="gt" style="text-anchor:end">GPU node</text>
<g class="box gpu"><rect x="740" y="204" width="300" height="104" rx="6"/><text x="890" y="228" class="bt">Sampler pod</text><text x="890" y="248" class="mono">python -m server.vllm_sampler</text><text x="890" y="264" class="mono">--model-id &lt;model_id&gt;</text><text x="890" y="286" class="bs">vLLM engine in this process</text></g>
<g class="box"><rect x="740" y="352" width="300" height="64" rx="6"/><text x="890" y="378" class="bt">Time slicer (FFT only)</text><text x="890" y="396" class="bs">one turn around each popped batch</text></g>
<path d="M890,308 V352" class="side" marker-start="url(#b1)" marker-end="url(#b1)"/>

<path d="M146,185 H200" class="flow" marker-end="url(#b1)"/><text x="173" y="177" class="lbl" text-anchor="middle">asample</text>
<path d="M370,160 H400 V94 H430" class="flow" marker-end="url(#b1)"/><text x="400" y="128" class="lbl" text-anchor="middle">creates</text>
<path d="M620,94 H680" class="flow" marker-end="url(#b1)"/><text x="650" y="86" class="lbl" text-anchor="middle">reads</text>
<path d="M775,124 V204" class="flow" marker-end="url(#b1)"/><text x="783" y="164" class="lbl">creates pod</text>
<path d="M370,215 H400 V330 H430" class="flow" marker-end="url(#b1)"/><text x="404" y="270" class="lbl">RPUSH</text>
<path d="M680,330 H700 V260 H740" class="flow" marker-start="url(#b1)"/><text x="640" y="290" class="lbl" text-anchor="middle">BLPOP, then the rest</text>
<path d="M740,290 H712 V422 H285 V378" class="flow" marker-end="url(#b1)"/><text x="500" y="416" class="lbl" text-anchor="middle">set_future</text>
<text x="200" y="446" style="font-size:12px;fill:#4d5560">No router: every replica of a model competes for the same list.</text>
</svg>
