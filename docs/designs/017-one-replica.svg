<svg viewBox="0 0 1200 548" class="arch" role="img" aria-labelledby="ot" xmlns="http://www.w3.org/2000/svg"><title id="ot">A pool with one replica</title>
<style>.arch{width:100%;height:auto;display:block;background:#fbfcfd}
.box rect{fill:#fff;stroke:#9aa3ae;stroke-width:1.2}.box.store rect{fill:#f3f5f8}.box.gpu rect{fill:#eef4fb;stroke:#7d9cc4}.box.accent rect{fill:#efedfa;stroke:#2f2a8a;stroke-width:1.6}
.box.optional rect{fill:#fff;stroke:#9aa3ae;stroke-width:1.2;stroke-dasharray:5 4}
.group{fill:none;stroke:#b9c0c8;stroke-width:1.2;stroke-dasharray:5 4}.cluster{fill:none;stroke:#7a828d;stroke-width:1.4}
.bt{font-size:14px;font-weight:600;fill:#16191d;text-anchor:middle}.bs{font-size:12px;fill:#4d5560;text-anchor:middle}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#2f2a8a;text-anchor:middle}
.gt{font-size:13px;font-weight:600;fill:#4d5560}.ct{font-size:15px;font-weight:650;fill:#16191d}.note{font-size:12px;fill:#4d5560}
.flow{fill:none;stroke:#16191d;stroke-width:1.4}.side{fill:none;stroke:#8a929c;stroke-width:1.3;stroke-dasharray:4 3}
.ahead{fill:#16191d}.lbl{font-size:11.5px;fill:#4d5560;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px;stroke-linejoin:round}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs><marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
<marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a929c"/></marker></defs>

<g class="box"><rect x="16" y="200" width="130" height="70" rx="6"/><text x="81" y="228" class="bt">Training loop</text><text x="81" y="246" class="bs">tinker SDK</text></g>
<rect x="176" y="16" width="1008" height="516" rx="12" class="cluster"/><text x="196" y="44" class="ct">GKE cluster</text>

<g class="box accent"><rect x="200" y="190" width="170" height="90" rx="6"/><text x="285" y="214" class="bt">API server</text><text x="285" y="236" class="bs">ensure(model, "sampler")</text><text x="285" y="252" class="bs">on the first save or</text><text x="285" y="268" class="bs">sampling session</text></g>

<g class="box"><rect x="420" y="64" width="200" height="64" rx="6"/><text x="520" y="88" class="bt">Sampler Workload</text><text x="520" y="108" class="bs">one replica</text></g>
<g class="box"><rect x="680" y="64" width="190" height="64" rx="6"/><text x="775" y="88" class="bt">OpenRL scheduler</text><text x="775" y="108" class="bs">DRA claim, then pod</text></g>

<g class="box store"><rect x="200" y="396" width="170" height="92" rx="6"/><text x="285" y="420" class="bt">Redis</text><text x="285" y="440" class="mono">open_rl:sampling:&lt;pool&gt;</text><text x="285" y="458" class="bs">read without removal</text><text x="285" y="476" class="mono">open_rl:future:&lt;id&gt;</text></g>

<rect x="568" y="160" width="600" height="312" rx="10" class="group"/><text x="1152" y="182" class="gt" style="text-anchor:end">GPU node</text>

<g class="box gpu"><rect x="592" y="196" width="320" height="252" rx="8"/><text x="752" y="220" class="bt">Sampler pod</text><text x="752" y="240" class="mono">python -m server.vllm_sampler --pool &lt;pool&gt;</text></g>
<g class="box"><rect x="612" y="260" width="280" height="56" rx="6"/><text x="752" y="284" class="bt">Dispatcher loop</text><text x="752" y="302" class="bs">read, generate, set_result</text></g>
<g class="box"><rect x="612" y="352" width="280" height="76" rx="6"/><text x="752" y="376" class="bt">vLLM engine, in this process</text><text x="752" y="396" class="mono">vllm_sampler.Sampler</text><text x="752" y="414" class="bs">loads each revision between batches</text></g>

<rect x="938" y="196" width="214" height="252" rx="8" class="group"/>
<text x="1045" y="216" class="bs">Only when it shares</text><text x="1045" y="232" class="bs">its trainer's GPU</text>
<g class="box optional"><rect x="954" y="252" width="182" height="64" rx="6"/><text x="1045" y="278" class="bt">Trainer pod</text><text x="1045" y="296" class="bs">FFT on one GPU</text></g>
<g class="box optional"><rect x="954" y="352" width="182" height="76" rx="6"/><text x="1045" y="378" class="bt">Time slicer</text><text x="1045" y="396" class="bs">one turn around</text><text x="1045" y="412" class="bs">each batch</text></g>

<path d="M146,235 H200" class="flow" marker-end="url(#o1)"/><text x="173" y="227" class="lbl" text-anchor="middle">asample</text>
<path d="M370,205 H394 V96 H420" class="flow" marker-end="url(#o1)"/><text x="394" y="150" class="lbl" text-anchor="middle">creates</text>
<path d="M620,96 H680" class="flow" marker-end="url(#o1)"/><text x="650" y="88" class="lbl" text-anchor="middle">reads</text>
<path d="M775,128 V196" class="flow" marker-end="url(#o1)"/><text x="783" y="152" class="lbl">creates pod</text>
<path d="M285,280 V396" class="flow" marker-end="url(#o1)"/><text x="293" y="342" class="lbl">XADD</text>
<path d="M370,442 H530 V288 H612" class="flow" marker-start="url(#o1)" marker-end="url(#o1)"/><text x="530" y="372" class="lbl" text-anchor="middle">read, set_result</text>
<path d="M752,316 V352" class="flow" marker-end="url(#o1)"/><text x="760" y="338" class="lbl">generate</text>
<path d="M912,390 H954" class="side" marker-start="url(#o2)" marker-end="url(#o2)"/>
<path d="M1045,316 V352" class="side" marker-start="url(#o2)" marker-end="url(#o2)"/>

<text x="200" y="516" class="note">No router, no Deployment, no NetworkPolicy. The replica runs the dispatcher loop itself.</text>
</svg>
