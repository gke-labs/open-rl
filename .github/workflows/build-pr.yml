name: build images on PR

on:
  pull_request:

jobs:
  build-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: api-server
            context: .
            dockerfile: src/server/Dockerfile.api_server
          - image_name: server
            context: .
            dockerfile: src/server/Dockerfile
          - image_name: client
            context: .
            dockerfile: src/server/Dockerfile.client
          - image_name: autoresearch
            context: .
            dockerfile: examples/autoresearch/Dockerfile
          - image_name: scheduler
            context: scheduler/controller
            dockerfile: scheduler/controller/Dockerfile
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
