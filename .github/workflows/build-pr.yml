name: build images on PR

on:
  # docs and website changes do not touch the images
  pull_request:
    paths-ignore:
      - "site/**"
      - "decks/**"
      - "docs/**"
      - "runs/**"
      - "**/*.md"
      - ".github/workflows/site.yml"

jobs:
  build-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: api-server
            context: .
            dockerfile: src/server/Dockerfile.api_server
          - image_name: server
            context: .
            dockerfile: src/server/Dockerfile
          - image_name: client
            context: .
            dockerfile: src/server/Dockerfile.client
          - image_name: automodel
            context: .
            dockerfile: src/server/Dockerfile.automodel
          - image_name: autoresearch
            context: .
            dockerfile: examples/autoresearch/Dockerfile
          - image_name: scheduler
            context: scheduler/controller
            dockerfile: scheduler/controller/Dockerfile
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
