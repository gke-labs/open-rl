name: Pig-latin E2E

on:
  # docs and website changes do not touch the code under test
  pull_request:
    paths-ignore:
      - "site/**"
      - "decks/**"
      - "docs/**"
      - "runs/**"
      - "**/*.md"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "decks/**"
      - "docs/**"
      - "runs/**"
      - "**/*.md"
      - ".github/workflows/site.yml"

# Cancel in-flight runs on the same PR when a new commit lands.
concurrency:
  group: piglatin-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  piglatin-qwen-cpu:
    name: Qwen3-0.6B pig-latin SFT (CPU, tinker ${{ matrix.tinker }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 0.29.0 sends forward_backward as protobuf and reads results as
        # protobuf; 0.24.1 is the last SDK that speaks JSON both ways.
        tinker: ["0.29.0", "0.24.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache Hugging Face hub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-${{ runner.os }}-qwen3-0.6b
          restore-keys: |
            hf-hub-${{ runner.os }}-

      - name: Install server deps (CPU extra)
        working-directory: src/server
        run: uv sync --extra cpu

      - name: Install client deps
        working-directory: examples
        run: |
          uv sync
          uv pip install "tinker==${{ matrix.tinker }}"

      - name: Run pig-latin SFT end-to-end
        run: PYTHONPATH=examples/sft/pig-latin uv --project examples run --no-sync python -m unittest tests.test_piglatin_qwen -v
        env:
          TINKER_API_KEY: tml-dummy-key
          TRANSFORMERS_VERBOSITY: error
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
