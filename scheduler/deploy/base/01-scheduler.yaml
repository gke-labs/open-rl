# The OpenRL scheduler.
#
# It runs beside kube-scheduler rather than replacing it: it cuts tiered
# ResourceClaims and books seats on their ClaimLedgers, and the real
# scheduler decides where each claim lands. Nothing else in the cluster
# changes when this is applied; without any Workload objects it
# watches an empty namespace and does nothing. Seat booking is
# CAS-arbitrated, so reconciles run concurrently; the leader lease keeps a
# rolling update from running two processes at once.
# The scheduler runs as the shared OpenRL control-plane account, open-rl-sa,
# declared by this base. The gateway adds its Workload permissions separately.
# Cluster-scoped only for reading nodes: the scheduler must see the capacity
# labels (openrl.io/enabled, /trainer, /sampler) to know which nodes accept
# which role, and the node's allocatable memory, which is what bounds how many
# workers can be parked on it at once.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-rl-fleet-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Pods on every node count against its allocatable memory, whichever
# namespace they live in. Reading them is what keeps the host-memory fit
# in step with kube-scheduler's.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# ResourceSlices are cluster-scoped and are how the scheduler learns what
# accelerators each node actually has.
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-rl-fleet-reader
subjects:
- kind: ServiceAccount
  name: open-rl-sa
  namespace: openrl-system
roleRef:
  kind: ClusterRole
  name: open-rl-fleet-reader
  apiGroup: rbac.authorization.k8s.io
---
# Everything else is namespaced, so the scheduler cannot reach pods or claims
# outside the namespace it was pointed at.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-placement-manager
rules:
- apiGroups: ["openrl.io"]
  resources: ["workloads"]
  # update is for the finalizer only: a deleted worker holds its seat until
  # its pod is verifiably gone. The spec itself is CEL-immutable.
  verbs: ["get", "list", "watch", "update"]
# The scheduler never edits a request, only reports on it.
- apiGroups: ["openrl.io"]
  resources: ["workloads/status"]
  verbs: ["get", "update", "patch"]
# Seating charts: the scheduler creates them with claims, books and releases
# seats through conditional updates, and retires empty ones inline.
- apiGroups: ["openrl.io"]
  resources: ["claimledgers"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Leader election.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-placement-manager
subjects:
- kind: ServiceAccount
  name: open-rl-sa
roleRef:
  kind: Role
  name: open-rl-placement-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-rl-scheduler
  labels:
    app: open-rl-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-rl-scheduler
  template:
    metadata:
      labels:
        app: open-rl-scheduler
    spec:
      serviceAccountName: open-rl-sa
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        # Built by `make docker-build docker-push` from controller/.
        image: ghcr.io/gke-labs/open-rl/scheduler:latest
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        env:
        - name: OPEN_RL_WORKER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPEN_RL_RECONCILE_INTERVAL
          value: "10s"
        # The DeviceClass generated claims request, and the driver whose
        # ResourceSlices describe the hardware. The driver name is also the CEL
        # domain the per-device memory floor is written against.
        - name: OPEN_RL_DEVICE_CLASS
          value: "gpu.nvidia.com"
        - name: OPEN_RL_DEVICE_DRIVER
          value: "gpu.nvidia.com"
        # How long a worker may go unplaced before the request is called
        # unsatisfiable. Without a deadline an impossible request waits forever,
        # indistinguishable from one that is merely queued behind a busy fleet.
        - name: OPEN_RL_PLACEMENT_TIMEOUT
          value: "15m"
        ports:
        - name: metrics
          containerPort: 8080
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
