apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The smoke overlay: the shipped manifests plus exactly what a smoke run
# needs -- the locally built image and the fake DRA driver's device class.
# Applied by scheduler/hack/kind-smoke.sh, so the smoke test validates the
# real manifests instead of shell fixups.
resources:
  - ../../base

images:
  - name: ghcr.io/openrl-dev/openrl/scheduler
    newName: open-rl/scheduler
    newTag: smoke

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: open-rl-scheduler
      spec:
        template:
          spec:
            containers:
              - name: manager
                # The kind-loaded image must not be re-pulled from a registry.
                imagePullPolicy: IfNotPresent
                env:
                  - name: OPEN_RL_DEVICE_CLASS
                    value: gpu.example.com
                  - name: OPEN_RL_DEVICE_DRIVER
                    value: gpu.example.com
