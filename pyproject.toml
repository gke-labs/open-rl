[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rl"
version = "0.0.1"
description = "Open-RL server and training runtime."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "chz>=0.4.0",
    "fastapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-gcp-trace",
    "protobuf>=5",
    "pydantic",
    "redis>=5.0.0",
    "uvicorn",
    "httpx",
    "tqdm>=4.50",
]

[project.entry-points."vllm.general_plugins"]
open_rl_weight_transfer = "server.delta_weight_transfer_engine:register_delta_weight_transfer"

[project.optional-dependencies]
cpu = [
    "cachetools",
    "cbor2",
    "datasets",
    "einops",
    "numpy",
    "openai",
    "openai_harmony",
    "peft",
    "pillow",
    "pybase64",
    "pyzmq",
    "torch",
    "transformers>=5.5.4",
]
gpu = [
    "datasets",
    "flash-linear-attention==0.5.1",
    "numpy",
    "peft",
    "tilelang>=0.1.9; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "transformers>=5.5.4",
]
vllm = [
    "torch; sys_platform == 'linux'",
    "torchaudio; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "torch-c-dlpack-ext; sys_platform == 'linux'",
    "vllm==0.30.0; sys_platform == 'linux'",
    # Prebuilt FlashInfer kernels, pinned to the flashinfer-python vLLM brings.
    # Without it a sampler JIT-builds kernels such as gdn_prefill_sm90 on every
    # fresh pod, ~30 minutes at MAX_JOBS=4.
    "flashinfer-jit-cache==0.6.18.post1; sys_platform == 'linux'",
]
# TPU trainer. torch_tpu is installed separately and pairs with torch 2.11.0.
tpu = [
    "datasets",
    "numpy",
    "peft",
    "torch==2.11.0",
    "transformers>=5.5.4",
]
# TPU sampler. torch and torchvision are listed so they come from the CPU index.
tpu-sampler = [
    "torch; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vllm-tpu==0.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Kubernetes cluster mode: the k8s API client used to launch FFT worker pods.
cluster = [
    "kubernetes>=29",
    # Kept in step with the snapshot-agent image deployed in
    # docs/setup/gke-fft-timeslice.md: both come from this upstream release.
    "timeslice @ git+https://github.com/llm-d-incubation/llm-d-rl-time-slicing.git@v0.1.0#subdirectory=pkg/client/python",
]
dev = [
    "ruff>=0.5.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["server*", "training*", "accel_timeslicer*"]

[tool.uv]
override-dependencies = [
    # vLLM still carries an older transformers constraint; keep the project on
    # the newer transformers line declared in our extras.
    "transformers>=5.5.4",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "vllm" },
    ],
    [
        { extra = "tpu" },
        { extra = "cpu" },
    ],
    [
        { extra = "tpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "tpu" },
        { extra = "vllm" },
    ],
    [
        { extra = "tpu-sampler" },
        { extra = "cpu" },
    ],
    [
        { extra = "tpu-sampler" },
        { extra = "gpu" },
    ],
    [
        { extra = "tpu-sampler" },
        { extra = "vllm" },
    ],
    [
        { extra = "tpu-sampler" },
        { extra = "tpu" },
    ],
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.30.0/cu129"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu129"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[tool.uv.sources]
# Pick the torch build from the user-facing cpu/gpu extras; vllm always uses CUDA torch.
# Both TPU extras use the CPU build.
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cpu", extra = "tpu" },
    { index = "torch-cpu", extra = "tpu-sampler", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "torch-cpu", extra = "tpu-sampler", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
vllm = [
    { index = "vllm-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]
flashinfer-jit-cache = [
    { index = "flashinfer-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
force-exclude = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "scratch",
    "scratch/**",
]
