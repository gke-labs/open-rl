[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rl-client"
version = "0.0.1"
description = "Open-RL client: CLI and shared utilities for talking to an Open-RL server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chz>=0.4.0",
    "jinja2",
    "matplotlib>=3.10.8",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "orjson>=3.11.8",
    "requests>=2.32.5",
    "tinker==0.23.0",
    "tinker-cookbook[math-rl]==0.5.7",
    "datasets>=4.5.0",
    "huggingface_hub>=0.28.1",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-exporter-gcp-trace>=1.11.0",
    "opentelemetry-sdk>=1.40.0",
    "transformers>=5.16.1",
    "ipykernel",
]

[project.optional-dependencies]
# Kubernetes sandbox backend for reward execution (examples/common/agent_sandbox.py).
# Optional so laptop runs without a cluster do not pull the kubernetes clients.
sandbox = ["k8s-agent-sandbox[async]>=1.0.1"]

[project.scripts]
harvey-train = "harvey_labs.train:main"
harvey-eval = "harvey_labs.eval_checkpoint:main"
harvey-results = "harvey_labs.results:main"
harvey-plot = "harvey_labs.plot_run:main"

# tinker-cookbook pulls in torch, but examples only need CPU-side client/data
# utilities. Force the CPU wheel to avoid downloading a CUDA build.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }

[tool.uv]
override-dependencies = [
    "transformers>=5.16.1",
    "torch",
]

[tool.setuptools.package-dir]
"" = "autoresearch"
"common" = "common"
"harvey_labs" = "harvey_labs"

[tool.setuptools]
py-modules = ["event_log", "run_attempt", "telemetry"]

[tool.setuptools.packages.find]
where = ["autoresearch", "."]
include = ["recipes*", "ui*", "common*", "harvey_labs*"]
