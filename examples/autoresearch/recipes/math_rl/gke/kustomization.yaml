apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One-shot Math-RL stack: the OpenRL LoRA stack plus the math_rl autoresearch
# add-on, in one namespace so the researchers share its service account and PVC.
namespace: openrl-system

resources:
- ../../../../../k8s/deploy/lora
- autoresearch

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: open-rl-config
  behavior: merge
  literals:
  - BASE_MODEL=Qwen/Qwen2.5-0.5B-Instruct
