# Same as ../../kustomization.yaml (the math_rl add-on); kustomize cannot
# include a parent directory, so the one-shot stack carries its own copy.

resources:
- ../../../../k8s/base

namePrefix: open-rl-

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/part-of: open-rl-autoresearch
    autoresearch.open-rl.dev/task: math-rl

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: autoresearch-settings
  behavior: merge
  literals:
  - RECIPE=recipes/math_rl/autoresearch.toml
  - LOG_ROOT=/mnt/shared/open-rl/autoresearch/math_rl
  - ATTEMPT_TIMEOUT_MINUTES=5
  - AGENT_TIMEOUT_MINUTES=10
  - READY_URLS=http://open-rl-api-server-service.openrl-system:8000/api/v1/healthz
  - TINKER_BASE_URL=http://open-rl-api-server-service.openrl-system:8000
  - TINKER_API_KEY=tml-dummy-key
  - SANDBOX_URL=http://sandbox-fusion-service:8080/run_code
  - SANDBOX_MAX_CONCURRENCY=8
