apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The LoRA stack with Gemma 4 E2B as the API server's default model. The
# scheduler starts the trainer and sampler workers when the recipe creates its
# training client, each on a GPU of its own.
namespace: openrl-system

resources:
  - ../../k8s/deploy/lora

labels:
  - pairs:
      app.kubernetes.io/part-of: text-to-sql
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    behavior: merge
    literals:
      - BASE_MODEL=google/gemma-4-e2b
